name: Build & Deploy
on:
  push:
    branches:
      - staging
      - dev
      - main

jobs:
  #V2
  run:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Retrieve the secret and decode it to a file
      env:
          IIQ_SVC: ${{ secrets.SECRETS_JSON }}
          ELGOOG_SVC: ${{ secrets.ELGOOG_SVC_CREDS }}
      run: |
          echo $IIQ_SVC | base64 --decode > ./secrets/secrets.json
          echo $ELGOOG_SVC | base64 --decode > ./secrets/svc-incidentiq-976dbf837333.json
    - name: default_to_dev
      run: echo "copilot_env=dev" >> $GITHUB_ENV
    - name: if_dev
      if: contains( github.ref, 'dev')
      run: echo "copilot_env=dev" >> $GITHUB_ENV
    - name: if_staging
      if: contains( github.ref, 'staging')
      run: echo "copilot_env=staging" >> $GITHUB_ENV
    - name: if_prod
      if: contains( github.ref, 'main')
      run: echo "copilot_env=prod" >> $GITHUB_ENV
    - name: Build the Docker image
      run: docker build . --build-arg COPILOT_ENV=$copilot_env --file Dockerfile --tag iiq
    - name: Run Docker
      run:  |
        echo "Env set to $copilot_env"
        docker run -d iiq
    - name: Cleanup
      run: |
        echo "Cleaning up old Docker Images"
        docker rm -v $(docker ps -a -q -f status=exited) || true
        docker rmi $(docker images -f "dangling=true" -q) || true
        docker image prune -a --force --filter "until=730h" || true